<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sovereign Self Script Builder</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --purple-deep:#241531;
    --purple-mid:#3d2657;
    --purple-glass:rgba(28,16,42,0.86);
    --purple-glass-light:rgba(61,38,87,0.55);
    --gold:#c9a24a;
    --gold-light:#e6c979;
    --gold-dim:rgba(201,162,74,0.35);
    --white:#f6f1e9;
    --white-dim:rgba(246,241,233,0.68);
    --white-faint:rgba(246,241,233,0.42);
    --error:#d98a6f;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;}
  body{
    font-family:'Inter',sans-serif;
    color:var(--white);
    min-height:100vh;
    background-color:var(--purple-deep);
    background-image:
      linear-gradient(180deg, rgba(20,10,30,0.55) 0%, rgba(20,10,30,0.75) 100%),
      url('Blank_Reset_Room_Image.jpg');
    background-size:cover;
    background-position:center;
    background-attachment:fixed;
    padding:32px 16px;
  }
  .app{
    width:100%;
    max-width:760px;
    margin:0 auto;
  }
  .card{
    background:var(--purple-glass);
    border:1px solid var(--gold-dim);
    border-radius:18px;
    padding:48px 44px;
    backdrop-filter:blur(6px);
    box-shadow:0 20px 60px rgba(0,0,0,0.45);
    animation:fadeIn 0.5s ease;
  }
  @keyframes fadeIn{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}
  @media (prefers-reduced-motion:reduce){.card{animation:none;}}

  h1,h2,h3{font-family:'Playfair Display',serif;font-weight:600;letter-spacing:0.01em;}
  .brand-eyebrow{
    text-transform:uppercase;
    letter-spacing:0.22em;
    font-size:11px;
    color:var(--gold-light);
    text-align:center;
    margin-bottom:10px;
  }
  .brand-title{
    text-align:center;
    font-size:30px;
    color:var(--white);
    margin-bottom:6px;
  }
  .brand-sub{
    text-align:center;
    font-size:13px;
    color:var(--white-dim);
    font-style:italic;
    margin-bottom:28px;
  }

  /* Progress bar */
  .progress-wrap{margin-bottom:34px;}
  .progress-label{
    display:flex;
    justify-content:space-between;
    font-size:11px;
    letter-spacing:0.08em;
    text-transform:uppercase;
    color:var(--white-faint);
    margin-bottom:8px;
  }
  .progress-track{
    height:3px;
    width:100%;
    background:rgba(255,255,255,0.12);
    border-radius:2px;
    overflow:hidden;
  }
  .progress-fill{
    height:100%;
    background:linear-gradient(90deg, var(--gold-dim), var(--gold-light));
    border-radius:2px;
    transition:width 0.5s ease;
  }

  .section-title{
    font-size:24px;
    color:var(--gold-light);
    margin-bottom:8px;
  }
  .section-framing{
    font-style:italic;
    color:var(--white-dim);
    font-size:15px;
    line-height:1.6;
    margin-bottom:30px;
    border-left:2px solid var(--gold-dim);
    padding-left:16px;
  }

  .question-block{margin-bottom:28px;}
  .question-block:last-of-type{margin-bottom:0;}
  .question-label{
    font-size:15.5px;
    line-height:1.55;
    color:var(--white);
    margin-bottom:4px;
    display:block;
  }
  .optional-tag{
    font-size:10.5px;
    letter-spacing:0.08em;
    text-transform:uppercase;
    color:var(--white-faint);
    margin-left:6px;
    font-style:normal;
  }
  .question-sub{
    font-size:12.5px;
    color:var(--white-faint);
    margin-bottom:10px;
    font-style:italic;
  }

  textarea{
    width:100%;
    min-height:120px;
    background:rgba(0,0,0,0.22);
    border:1px solid rgba(255,255,255,0.15);
    border-radius:10px;
    padding:14px 16px;
    color:var(--white);
    font-family:'Inter',sans-serif;
    font-size:14.5px;
    line-height:1.6;
    resize:vertical;
    transition:border-color 0.2s ease, background 0.2s ease;
  }
  textarea::placeholder{color:var(--white-faint);font-style:italic;}
  textarea:focus{
    outline:none;
    border-color:var(--gold);
    background:rgba(0,0,0,0.32);
  }
  textarea:focus-visible{outline:2px solid var(--gold-light);outline-offset:2px;}
  .char-count{
    text-align:right;
    font-size:10.5px;
    color:var(--white-faint);
    margin-top:5px;
  }

  input[type="text"]{
    width:100%;
    background:rgba(0,0,0,0.22);
    border:1px solid rgba(255,255,255,0.15);
    border-radius:10px;
    padding:13px 16px;
    color:var(--white);
    font-family:'Inter',sans-serif;
    font-size:15px;
  }
  input[type="text"]:focus{outline:none;border-color:var(--gold);}
  input[type="text"]:focus-visible{outline:2px solid var(--gold-light);outline-offset:2px;}
  input[type="text"]::placeholder{color:var(--white-faint);font-style:italic;}

  .btn-select-group{display:flex;flex-wrap:wrap;gap:10px;}
  .btn-select{
    flex:1 1 auto;
    min-width:120px;
    background:rgba(255,255,255,0.05);
    border:1px solid rgba(255,255,255,0.22);
    color:var(--white);
    padding:13px 18px;
    border-radius:10px;
    font-family:'Inter',sans-serif;
    font-size:14px;
    cursor:pointer;
    transition:all 0.2s ease;
    text-align:center;
  }
  .btn-select:hover{border-color:var(--gold-light);background:rgba(201,162,74,0.1);}
  .btn-select:focus-visible{outline:2px solid var(--gold-light);outline-offset:2px;}
  .btn-select.selected{
    background:linear-gradient(135deg, var(--gold-dim), rgba(201,162,74,0.25));
    border-color:var(--gold);
    color:var(--gold-light);
  }

  .conditional-panel{
    margin-top:16px;
    padding-top:2px;
    animation:fadeIn 0.35s ease;
  }

  .nav-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-top:38px;
    gap:14px;
  }
  .btn{
    font-family:'Inter',sans-serif;
    font-size:14px;
    letter-spacing:0.02em;
    padding:13px 28px;
    border-radius:100px;
    cursor:pointer;
    border:1px solid transparent;
    transition:all 0.2s ease;
  }
  .btn:focus-visible{outline:2px solid var(--gold-light);outline-offset:2px;}
  .btn-primary{
    background:linear-gradient(135deg, var(--gold), var(--gold-light));
    color:var(--purple-deep);
    font-weight:600;
    border:none;
    flex:0 0 auto;
    margin-left:auto;
  }
  .btn-primary:hover{filter:brightness(1.08);transform:translateY(-1px);}
  .btn-primary:disabled{opacity:0.4;cursor:not-allowed;transform:none;filter:none;}
  .btn-ghost{
    background:transparent;
    color:var(--white-dim);
    border:1px solid rgba(255,255,255,0.2);
  }
  .btn-ghost:hover{border-color:var(--gold-light);color:var(--gold-light);}

  .validation-msg{
    font-size:12px;
    color:var(--error);
    margin-top:10px;
    display:none;
  }
  .validation-msg.show{display:block;}

  /* Privacy screen */
  .privacy-screen{text-align:center;}
  .privacy-icon{font-size:34px;margin-bottom:18px;color:var(--gold-light);}
  .privacy-text{
    font-size:16px;
    line-height:1.75;
    color:var(--white);
    max-width:480px;
    margin:0 auto 32px;
  }

  /* Commitment screen */
  .commitment-screen{text-align:center;}
  .commitment-text{
    font-size:15.5px;
    line-height:1.75;
    color:var(--white-dim);
    max-width:480px;
    margin:18px auto 30px;
  }
  .commitment-name-wrap{max-width:340px;margin:0 auto 26px;text-align:left;}
  .commitment-name-wrap label{
    display:block;
    font-size:11px;
    letter-spacing:0.08em;
    text-transform:uppercase;
    color:var(--white-faint);
    margin-bottom:8px;
  }

  /* Loading */
  .loading-screen{text-align:center;padding:30px 0;}
  .loading-spinner{
    width:44px;height:44px;
    margin:0 auto 24px;
    border-radius:50%;
    border:2px solid rgba(201,162,74,0.2);
    border-top-color:var(--gold);
    animation:spin 1.1s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg);}}
  @media (prefers-reduced-motion:reduce){.loading-spinner{animation:spin 2.2s linear infinite;}}
  .loading-text{color:var(--white-dim);font-size:14px;font-style:italic;}

  /* Result */
  .result-header{text-align:center;margin-bottom:8px;}
  .script-body{
    background:rgba(0,0,0,0.24);
    border:1px solid var(--gold-dim);
    border-radius:12px;
    padding:32px 30px;
    margin:24px 0 14px;
    font-family:'Playfair Display',serif;
    font-size:17px;
    line-height:2;
    color:var(--white);
    white-space:pre-wrap;
  }
  .result-instruction{
    text-align:center;
    font-size:13px;
    font-style:italic;
    color:var(--gold-light);
    margin-bottom:28px;
  }
  .result-actions{
    display:flex;
    flex-wrap:wrap;
    gap:12px;
    justify-content:center;
    margin-bottom:14px;
  }
  .result-actions .btn{flex:0 0 auto;margin-left:0;}
  .copy-confirm{
    text-align:center;
    font-size:12px;
    color:var(--gold-light);
    height:16px;
    margin-top:8px;
  }
  .revise-row{text-align:center;margin-top:10px;}
  .revise-link{
    background:none;border:none;
    color:var(--white-faint);
    font-size:12.5px;
    text-decoration:underline;
    cursor:pointer;
    font-family:'Inter',sans-serif;
  }
  .revise-link:hover{color:var(--gold-light);}

  .error-box{
    background:rgba(217,138,111,0.12);
    border:1px solid rgba(217,138,111,0.4);
    border-radius:10px;
    padding:18px 20px;
    text-align:center;
    color:var(--white);
    font-size:13.5px;
    line-height:1.6;
    margin-top:6px;
  }

  @media print{
    body{background:#fff !important;padding:0;}
    .card{background:#fff !important;border:none;box-shadow:none;color:#000;backdrop-filter:none;padding:20px;}
    .progress-wrap,.result-actions,.revise-row,.brand-eyebrow{display:none !important;}
    .script-body{background:#fff !important;border:1px solid #ccc;color:#000;}
    .result-instruction,.brand-sub{color:#444 !important;}
  }

  @media (max-width:600px){
    .card{padding:32px 22px;}
    .brand-title{font-size:24px;}
    .section-title{font-size:20px;}
    .nav-row{flex-wrap:wrap;}
    .btn-ghost{order:2;}
    .btn-primary{order:1;width:100%;margin-left:0;}
  }
</style>
</head>
<body>

<div class="app">
  <div class="card" id="card">
    <!-- content injected by JS -->
  </div>
</div>

<script>
/* ============================================================
   SOVEREIGN SELF SCRIPT BUILDER
   All data stays in-browser. No storage, no network calls
   except the single Claude API request to generate the script.
   ============================================================ */

const SYSTEM_PROMPT = "You are writing a deeply personal sovereign self script for a woman who has been doing deep pattern-recognition, nervous system regulation, and boundary work on herself. This script is hers alone, written in her voice, from her answers, about who she actually is when the patterns are not running the show.\n\nYour job is to take her raw answers and craft a 400-500 word script she will record in her own voice and listen to every single morning for 30 days. This is not a meditation. It is not a generic affirmation track. It is a coded identity statement: her nervous system receiving her own truth in her own words, every day, until it becomes the loudest voice in the room.\n\nWrite in first person present tense throughout. Use her exact words wherever possible. Do not paraphrase what she gave you unless it is grammatically necessary. Keep sentences short and speakable. This will be read aloud slowly. No toxic positivity. No I am perfect or I have it all figured out. No generic affirmations that could belong to anyone. Every line must be specific to what she wrote.\n\nStructure the script in five sections. Do not label them, just flow naturally between them:\n\nOPENING (GROUNDING): Who she is. Her name is not known to you so open with I am a woman who and use her answer to the final sentence prompt. One breath. Present tense. She is arriving into herself.\n\nTHE RELEASE: What she is no longer. What she is done carrying. What she is giving back. Pull directly from her answers about patterns, voices, apologies, and permissions she has been waiting for. This section should feel like exhaling something heavy.\n\nTHE RECLAIM: What she is choosing. Her values. Her non-negotiables. Her body's yes. What her body deserves. Pull from her non-negotiables and body sections. This section should feel like standing up straight.\n\nTHE RELATIONSHIP: only include this section if she answered the love and intimacy questions. If she is calling in a partner weave it as a present tense statement of what she is ready to receive, written as if it is already on its way, not as a wish. If she is in a relationship write it as a commitment to showing up differently. If she answered the intimacy questions weave those in. Never mention motherhood unless she selected Yes and answered the question.\n\nTHE CALL FORWARD: What she is calling in. What she is ready to receive. End with her three completed sentences (I am a woman who, I trust myself to, I no longer need) as the closing lines of the script. These are the last words she hears every morning. Make them land.\n\nThe tone is grounded, embodied, and sovereign, not inspirational speaker, not therapy session, not poetry slam. A woman who knows who she is, speaking it into her own nervous system until it becomes true in every cell.";

// ---------- Question data ----------

const SECTION1 = {
  title: "Who You Are Underneath All of It",
  framing: "Before the roles. Before the responsibilities. Before you became everything to everyone.",
  questions: [
    {id:"s1_alone", label:"When you are completely alone and no one needs anything from you, who shows up? Not who you think you should be. Who actually arrives?", placeholder:"e.g. She's quiet at first. She doesn't perform for anyone. She notices things she usually ignores: the light, her own breathing, what she actually wants to eat instead of what's easiest..."},
    {id:"s1_quality", label:"What is the quality in you that the people in your life have benefited from most, that you yourself have rarely been given?", placeholder:"e.g. I hold everyone together when things fall apart. I've never once had someone hold that space for me."},
    {id:"s1_never_said", label:"What do you know to be true about yourself that you have never said out loud to another person, not because it is shameful, but because it has always felt too big, too real, or too much to claim?", placeholder:"e.g. I know I'm capable of more than the life I've built. I've never said that out loud because it sounds arrogant, but it's just true."},
    {id:"s1_kept_small", label:"What version of yourself have you been keeping small because you were afraid of what it would ask of you if you let her get bigger?", placeholder:"e.g. The one who says no without explaining herself. If she got bigger, I'd have to disappoint people I love."}
  ]
};

const SECTION2 = {
  title: "Your Body and What It Has Been Trying to Tell You",
  framing: "Your body has been sending signals for years. This is your chance to hear them.",
  questions: [
    {id:"s2_asking", label:"What is your body asking for right now that you have been overriding in the name of responsibility, productivity, or someone else's comfort?", placeholder:"e.g. Rest, without earning it first. It's been asking for months and I keep answering with another task."},
    {id:"s2_wrong", label:"When you are in a room and something feels wrong, before anyone has said a word, where in your body do you feel it first? Describe that sensation.", placeholder:"e.g. My chest tightens and my jaw locks. It happens before my brain even catches up to what's wrong."},
    {id:"s2_yourself", label:"What does it feel like in your body when you are completely, fully, undeniably yourself? Where does that feeling live? What does it weigh? What does it sound like?", placeholder:"e.g. My shoulders drop. It lives low in my belly, warm and steady. It sounds like nothing, no noise in my head at all."},
    {id:"s2_survived", label:"What has your body survived that you have never fully acknowledged or honored?", placeholder:"e.g. Two decades of running on adrenaline while I told everyone I was fine."}
  ]
};

const SECTION3 = {
  title: "What You Are Done With",
  framing: "Not what you should release. What you are actually, finally, no longer willing to carry.",
  questions: [
    {id:"s3_exhausted", label:"What pattern, role, or way of being are you the most exhausted by: the one you keep returning to even when you know better?", placeholder:"e.g. Being the one who fixes everything so no one has to feel uncomfortable but me."},
    {id:"s3_apologizing", label:"What have you been apologizing for that you are done apologizing for?", placeholder:"e.g. Needing time to think before I answer. Wanting things to be easy sometimes."},
    {id:"s3_voice", label:"Whose voice have you been living by that was never actually yours? What did it tell you that you are ready to stop believing?", placeholder:"e.g. My mother's voice, telling me good women don't ask for more. I'm done believing wanting more makes me less good."},
    {id:"s3_permission", label:"What have you been waiting for permission to do, be, or want, and who exactly have you been waiting to give it to you?", placeholder:"e.g. Permission to want a life that's just mine. I've been waiting for my kids, my ex, everyone but me."}
  ]
};

const SECTION4 = {
  title: "Your Non-Negotiables",
  framing: "The things that are no longer up for debate. The standards you are setting for the rest of your life.",
  questions: [
    {id:"s4_nonneg", label:"What is the one thing, the absolute non-negotiable, that you are committing to protecting for yourself from this point forward? Not a goal. A standard. Something you will no longer compromise on.", placeholder:"e.g. My mornings. No one gets access to me before I've had mine."},
    {id:"s4_trusts_self", label:"What does a woman who trusts herself completely do differently than you have been doing? Be specific. Name the actual behavior.", placeholder:"e.g. She says 'let me think about it' instead of agreeing on the spot. She doesn't explain her no three times."},
    {id:"s4_boundary", label:"What boundary, if you held it consistently for the next 90 days, would change the quality of your daily life more than anything else?", placeholder:"e.g. Not answering messages after 8pm. That single boundary would give me my evenings back."}
  ]
};

// ---------- Section 5: Roles ----------
const S5_MOTHER_DETAIL = {id:"s5_mother_detail", label:"What do you want your children to witness in you from this point forward, not what you want to teach them, what you want them to see you living?", placeholder:"e.g. I want them to watch me set a boundary and not apologize for it. I want them to see a woman who rests without guilt."};
const S5_WORK_DETAIL = {id:"s5_work_detail", label:"What do you want your work to be an expression of, not what you want to achieve, but who you want it to show the world you are?", placeholder:"e.g. I want it to show that I stopped shrinking to be palatable. That I built something on my own terms."};

// ---------- Section 6: relationship question groups ----------
const REL_IN_RELATIONSHIP = [
  {id:"s6_smaller_version", label:"Where in your relationship have you been showing up as a smaller version of yourself, and what would it look like to show up as her instead?", placeholder:"e.g. I go quiet instead of saying what I actually need. Showing up as her would mean speaking before I'm resentful."},
  {id:"s6_deserve_relationship", label:"What do you deserve in this relationship that you have been settling for less than? Name it. Do not soften it.", placeholder:"e.g. I deserve to be pursued, not just relied on."},
  {id:"s6_partner_feel", label:"What do you want your partner to feel in your presence that they may not feel enough of right now?", placeholder:"e.g. Ease. I want them to feel like they don't have to manage me."}
];
const REL_CALLING_IN_TOGGLE = {id:"s6_calling_in", label:"Are you open to calling in a partner?", type:"buttons", options:["Yes","No, both are sovereign answers"]};
const REL_CALLING_IN_DETAIL = {id:"s6_calling_in_feel", label:"Do not describe who they are. Describe how you feel in their presence. Safe? Chosen? Equal? Electric? Seen without performing? Use your own words, as many as you need.", placeholder:"e.g. Safe enough to be unimpressive sometimes. Chosen without having to prove I'm worth choosing."};
const REL_DESERVE_LOVE = {id:"s6_deserve_love", label:"What do you deserve in love that every version of you before this one accepted less than?", placeholder:"e.g. I deserve someone who doesn't need convincing to show up."};
const REL_STOP_TOLERATING = {id:"s6_stop_tolerating", label:"What are you finally ready to stop tolerating in a relationship?", placeholder:"e.g. Being an afterthought. Explaining my worth to someone who should already see it."};
const REL_COMMON = [
  {id:"s6_intimacy", label:"Regardless of your relationship status: What does intimacy mean to you right now, emotional, physical, spiritual, or all of it? What are you hungry for that you have not given yourself permission to name?", placeholder:"e.g. Right now intimacy means being known without having to explain myself first. I'm hungry for touch that isn't asking for anything back."},
  {id:"s6_loved_as_you_are", label:"What would it feel like to be loved exactly as you are, not the managed version, not the performing version, the actual you? Describe that feeling in your body.", placeholder:"e.g. My chest would unclench. I think I'd finally exhale all the way."}
];

const SECTION7 = {
  title: "Your Future",
  framing: "Not what you think is realistic. What you actually want. What your soul has been asking for.",
  questions: [
    {id:"s7_blocking", label:"What is the one thing you have been blocking or delaying that part of you knows is already yours, if you would just get out of your own way and let it arrive?", placeholder:"e.g. The business idea I've had for two years. It's mine. I keep finding reasons it isn't time."},
    {id:"s7_receive", label:"What are you ready to receive that used to feel like too much to ask for? Name it without qualifying it. Do not add a but.", placeholder:"e.g. Ease. Rest that isn't earned. Support I didn't have to ask for three times."},
    {id:"s7_life_feels", label:"What does your life feel like, in your body, in your chest, in the quality of your mornings, when you are living as her?", placeholder:"e.g. Slower. My chest is open instead of braced. Mornings feel like mine before they belong to anyone else."}
  ]
};
const SECTION7_SENTENCES = [
  {id:"s7_sentence1", label:"I am a woman who ___________", placeholder:"finishes what she starts, even when no one is watching..."},
  {id:"s7_sentence2", label:"I trust myself to ___________", placeholder:"make the hard call and live with it..."},
  {id:"s7_sentence3", label:"I no longer need ___________", placeholder:"permission to want what I want..."}
];

// ---------- State ----------
let state = {
  step: "privacy",       // privacy | s1 | s2 | s3 | s4 | s5 | s6 | s7 | commitment | generating | result | error
  answers: {},
  committedName: "",
  generatedScript: "",
  s5_mother_choice: null,     // "Yes" | "No" | "I prefer not to include this"
  s5_work_choice: null,       // "Yes" | "No"
  s6_status: null,             // "Yes" | "No" | "It's complicated"
  s6_calling_in_choice: null   // "Yes" | "No, both are sovereign answers"
};

const STEP_ORDER = ["privacy","s1","s2","s3","s4","s5","s6","s7","commitment","generating","result"];
const SECTION_STEPS = ["s1","s2","s3","s4","s5","s6","s7"]; // for progress bar (7 total)

const card = document.getElementById("card");

// ---------- Helpers ----------
function esc(str){
  const d = document.createElement("div");
  d.textContent = str || "";
  return d.innerHTML;
}

function progressBar(){
  const idx = SECTION_STEPS.indexOf(state.step);
  if(idx === -1) return "";
  const pct = Math.round(((idx+1)/SECTION_STEPS.length)*100);
  return `
    <div class="progress-wrap">
      <div class="progress-label"><span>Section ${idx+1} of ${SECTION_STEPS.length}</span><span>${pct}%</span></div>
      <div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div>
    </div>
  `;
}

function brandHeader(){
  return `
    <h1 class="brand-title">Sovereign Self Script Builder</h1>
  `;
}

function textareaBlock(q, required=true){
  const val = state.answers[q.id] || "";
  return `
    <div class="question-block">
      <label class="question-label" for="${q.id}">${esc(q.label)}${!required ? '<span class="optional-tag">Optional</span>' : ''}</label>
      ${q.sub ? `<div class="question-sub">${esc(q.sub)}</div>` : ""}
      <textarea id="${q.id}" data-qid="${q.id}" placeholder="${esc(q.placeholder||"")}" oninput="onAnswerInput(this)">${esc(val)}</textarea>
    </div>
  `;
}

function buttonGroupBlock(id, label, options, currentValue, onclickFn){
  return `
    <div class="question-block">
      <label class="question-label">${esc(label)}</label>
      <div class="btn-select-group" role="group" aria-label="${esc(label)}">
        ${options.map(opt => `
          <button type="button" class="btn-select ${currentValue===opt ? 'selected':''}" onclick="${onclickFn}('${opt.replace(/'/g,"\\'")}')">${esc(opt)}</button>
        `).join("")}
      </div>
    </div>
  `;
}

function onAnswerInput(el){
  state.answers[el.dataset.qid] = el.value;
}

function goTo(step){
  state.step = step;
  render();
  window.scrollTo(0, 0);
}

// ---------- Validation ----------
function sectionQuestionIds(list){ return list.map(q=>q.id); }

function isFilled(id){
  return (state.answers[id] || "").trim().length > 0;
}

function validateSection1234(list){
  return list.every(q => isFilled(q.id));
}

function validateSection5(){
  if(!state.s5_mother_choice || !state.s5_work_choice) return false;
  if(state.s5_mother_choice === "Yes" && !isFilled("s5_mother_detail")) return false;
  if(state.s5_work_choice === "Yes" && !isFilled("s5_work_detail")) return false;
  return true;
}

function validateSection6(){
  if(!state.s6_status) return false;
  if(state.s6_status === "Yes" || state.s6_status === "It's complicated"){
    if(!REL_IN_RELATIONSHIP.every(q=>isFilled(q.id))) return false;
  }
  if(state.s6_status === "No" || state.s6_status === "It's complicated"){
    if(!state.s6_calling_in_choice) return false;
    if(state.s6_calling_in_choice === "Yes" && !isFilled("s6_calling_in_feel")) return false;
    if(!isFilled("s6_deserve_love") || !isFilled("s6_stop_tolerating")) return false;
  }
  if(!REL_COMMON.every(q=>isFilled(q.id))) return false;
  return true;
}

function validateSection7(){
  return SECTION7.questions.every(q=>isFilled(q.id)) && SECTION7_SENTENCES.every(q=>isFilled(q.id));
}

// ---------- Renderers per step ----------

function renderPrivacy(){
  card.innerHTML = `
    ${brandHeader()}
    <div class="privacy-screen">
      <div class="privacy-icon">&#10022;</div>
      <p class="privacy-text">Your answers and your script are completely private. Nothing you enter here is stored, sent, or seen by anyone. This is yours alone.</p>
      <div class="nav-row" style="justify-content:center;">
        <button class="btn btn-primary" style="margin-left:0;" onclick="goTo('s1')">Begin</button>
      </div>
    </div>
  `;
}

function renderStaticSection(sectionData, sectionKey, prevStep, nextStep){
  card.innerHTML = `
    ${brandHeader()}
    ${progressBar()}
    <h2 class="section-title">${esc(sectionData.title)}</h2>
    <p class="section-framing">${esc(sectionData.framing)}</p>
    ${sectionData.questions.map(q => textareaBlock(q)).join("")}
    <div class="validation-msg" id="valMsg">Every question in this section needs an answer before you continue. Take your time.</div>
    <div class="nav-row">
      ${prevStep ? `<button class="btn btn-ghost" onclick="goTo('${prevStep}')">Back</button>` : `<span></span>`}
      <button class="btn btn-primary" onclick="attemptAdvance('${sectionKey}','${nextStep}')">Continue</button>
    </div>
  `;
}

function attemptAdvance(sectionKey, nextStep){
  let valid = false;
  const map = {s1:SECTION1.questions, s2:SECTION2.questions, s3:SECTION3.questions, s4:SECTION4.questions};
  if(map[sectionKey]) valid = validateSection1234(map[sectionKey]);
  if(sectionKey === "s5") valid = validateSection5();
  if(sectionKey === "s6") valid = validateSection6();
  if(sectionKey === "s7") valid = validateSection7();

  if(!valid){
    const msg = document.getElementById("valMsg");
    if(msg) msg.classList.add("show");
    return;
  }
  goTo(nextStep);
}

function renderSection5(){
  const showMotherDetail = state.s5_mother_choice === "Yes";
  const showWorkDetail = state.s5_work_choice === "Yes";
  card.innerHTML = `
    ${brandHeader()}
    ${progressBar()}
    <h2 class="section-title">Your Roles</h2>
    <p class="section-framing">Only answer what is true for you. Skip anything that does not apply. Nothing here is required.</p>

    ${buttonGroupBlock("s5_mother","Are you a mother?", ["Yes","No","I prefer not to include this"], state.s5_mother_choice, "setMotherChoice")}
    ${showMotherDetail ? `<div class="conditional-panel">${textareaBlock(S5_MOTHER_DETAIL)}</div>` : ""}

    ${buttonGroupBlock("s5_work","Do you have work, a business, or a calling that matters to you?", ["Yes","No"], state.s5_work_choice, "setWorkChoice")}
    ${showWorkDetail ? `<div class="conditional-panel">${textareaBlock(S5_WORK_DETAIL)}</div>` : ""}

    <div class="validation-msg" id="valMsg">Please make a selection for both questions above (and fill in the follow-up if it appears) before continuing.</div>
    <div class="nav-row">
      <button class="btn btn-ghost" onclick="goTo('s4')">Back</button>
      <button class="btn btn-primary" onclick="attemptAdvance('s5','s6')">Continue</button>
    </div>
  `;
}
function setMotherChoice(val){ state.s5_mother_choice = val; renderSection5(); }
function setWorkChoice(val){ state.s5_work_choice = val; renderSection5(); }

function renderSection6(){
  const status = state.s6_status;
  let html = `
    ${brandHeader()}
    ${progressBar()}
    <h2 class="section-title">Love, Intimacy, and What You Deserve</h2>
    <p class="section-framing">This section is the most private and the most powerful. Answer only what feels true. Nothing here leaves this page.</p>
    ${buttonGroupBlock("s6_status","Are you currently in a relationship?", ["Yes","No","It's complicated"], status, "setRelStatus")}
  `;

  if(status === "Yes" || status === "It's complicated"){
    html += `<div class="conditional-panel">${REL_IN_RELATIONSHIP.map(q=>textareaBlock(q)).join("")}</div>`;
  }
  if(status === "No" || status === "It's complicated"){
    html += `<div class="conditional-panel">
      ${buttonGroupBlock("s6_calling_in", REL_CALLING_IN_TOGGLE.label, REL_CALLING_IN_TOGGLE.options, state.s6_calling_in_choice, "setCallingInChoice")}
      ${state.s6_calling_in_choice === "Yes" ? textareaBlock(REL_CALLING_IN_DETAIL) : ""}
      ${textareaBlock(REL_DESERVE_LOVE)}
      ${textareaBlock(REL_STOP_TOLERATING)}
    </div>`;
  }
  if(status){
    html += `<div class="conditional-panel">${REL_COMMON.map(q=>textareaBlock(q)).join("")}</div>`;
  }

  html += `
    <div class="validation-msg" id="valMsg">A few answers in this section still need filling in before you continue.</div>
    <div class="nav-row">
      <button class="btn btn-ghost" onclick="goTo('s5')">Back</button>
      <button class="btn btn-primary" onclick="attemptAdvance('s6','s7')">Continue</button>
    </div>
  `;
  card.innerHTML = html;
}
function setRelStatus(val){ state.s6_status = val; renderSection6(); }
function setCallingInChoice(val){ state.s6_calling_in_choice = val; renderSection6(); }

function renderSection7(){
  card.innerHTML = `
    ${brandHeader()}
    ${progressBar()}
    <h2 class="section-title">${esc(SECTION7.title)}</h2>
    <p class="section-framing">${esc(SECTION7.framing)}</p>
    ${SECTION7.questions.map(q=>textareaBlock(q)).join("")}
    <h3 style="font-size:16px;color:var(--gold-light);margin:30px 0 4px;font-family:'Playfair Display',serif;">Now finish these three sentences</h3>
    <p class="question-sub" style="margin-bottom:20px;">Take as long as you need. Do not edit yourself.</p>
    ${SECTION7_SENTENCES.map(q=>textareaBlock(q)).join("")}
    <div class="validation-msg" id="valMsg">Every question and all three sentences need an answer before you continue.</div>
    <div class="nav-row">
      <button class="btn btn-ghost" onclick="goTo('s6')">Back</button>
      <button class="btn btn-primary" onclick="attemptAdvance('s7','commitment')">Continue</button>
    </div>
  `;
}

function renderCommitment(){
  card.innerHTML = `
    ${brandHeader()}
    <div class="commitment-screen">
      <h2 class="section-title" style="text-align:center;">Your 30-Day Commitment</h2>
      <p class="commitment-text">This script was written by you, for you, in your own words. The practice is simple: listen to it every single morning for 30 days in your own voice. Record it tonight. Play it tomorrow. Type your name below and commit to the practice.</p>
      <div class="commitment-name-wrap">
        <label for="commitName">Your name</label>
        <input type="text" id="commitName" value="${esc(state.committedName)}" placeholder="Type your name" oninput="state.committedName=this.value">
      </div>
      <div class="validation-msg" id="valMsg">Type your name to commit to the practice.</div>
      <div class="nav-row" style="justify-content:center;flex-direction:column;align-items:center;">
        <button class="btn btn-primary" style="margin-left:0;" onclick="attemptCommit()">I commit to this.</button>
        <button class="btn btn-ghost" style="margin-top:14px;" onclick="goTo('s7')">Back</button>
      </div>
    </div>
  `;
}

function attemptCommit(){
  if(!state.committedName.trim()){
    document.getElementById("valMsg").classList.add("show");
    return;
  }
  goTo("generating");
  generateScript();
}

function renderGenerating(){
  card.innerHTML = `
    ${brandHeader()}
    <div class="loading-screen">
      <div class="loading-spinner" role="status" aria-label="Generating your script"></div>
      <p class="loading-text">Writing your script from your own words...</p>
    </div>
  `;
}

function renderResult(){
  card.innerHTML = `
    <div class="result-header">${brandHeader()}</div>
    <div class="script-body" id="scriptBody">${esc(state.generatedScript)}</div>
    <p class="result-instruction">Read this slowly. Record it in your own voice. Listen every morning for 30 days.</p>
    <div class="result-actions">
      <button class="btn btn-ghost" onclick="copyScript()">Copy Script</button>
      <button class="btn btn-ghost" onclick="window.print()">Print</button>
    </div>
    <div class="copy-confirm" id="copyConfirm"></div>
    <div class="revise-row">
      <button class="revise-link" onclick="goTo('s1')">Revise My Answers</button>
    </div>
  `;
}

function renderErrorScreen(message){
  card.innerHTML = `
    ${brandHeader()}
    <div class="error-box">
      <p><strong>The script couldn't be generated.</strong></p>
      <p style="margin-top:8px;">${esc(message)}</p>
    </div>
    <div class="nav-row" style="justify-content:center;">
      <button class="btn btn-primary" style="margin-left:0;" onclick="goTo('generating');generateScript();">Try Again</button>
    </div>
    <div class="nav-row" style="justify-content:center;margin-top:10px;">
      <button class="btn btn-ghost" onclick="goTo('commitment')">Back</button>
    </div>
  `;
}

function copyScript(){
  navigator.clipboard.writeText(state.generatedScript).then(()=>{
    const c = document.getElementById("copyConfirm");
    if(c){ c.textContent = "Copied."; setTimeout(()=>{ if(c) c.textContent=""; }, 2200); }
  });
}

// ---------- Compile answers for the API ----------
function compileUserMessage(){
  let parts = [];

  parts.push("SECTION 1: WHO SHE IS UNDERNEATH IT ALL");
  SECTION1.questions.forEach(q => parts.push(`Q: ${q.label}\nA: ${state.answers[q.id]}`));

  parts.push("\nSECTION 2: HER BODY");
  SECTION2.questions.forEach(q => parts.push(`Q: ${q.label}\nA: ${state.answers[q.id]}`));

  parts.push("\nSECTION 3: WHAT SHE IS DONE WITH");
  SECTION3.questions.forEach(q => parts.push(`Q: ${q.label}\nA: ${state.answers[q.id]}`));

  parts.push("\nSECTION 4: HER NON-NEGOTIABLES");
  SECTION4.questions.forEach(q => parts.push(`Q: ${q.label}\nA: ${state.answers[q.id]}`));

  parts.push("\nSECTION 5: HER ROLES");
  if(state.s5_mother_choice === "Yes"){
    parts.push(`She is a mother.\nQ: ${S5_MOTHER_DETAIL.label}\nA: ${state.answers[S5_MOTHER_DETAIL.id]}`);
  } else {
    parts.push("She is not including motherhood in this script. Do not mention motherhood anywhere.");
  }
  if(state.s5_work_choice === "Yes"){
    parts.push(`Q: ${S5_WORK_DETAIL.label}\nA: ${state.answers[S5_WORK_DETAIL.id]}`);
  }

  parts.push("\nSECTION 6: LOVE, INTIMACY, WHAT SHE DESERVES");
  parts.push(`Relationship status: ${state.s6_status}`);
  if(state.s6_status === "Yes" || state.s6_status === "It's complicated"){
    REL_IN_RELATIONSHIP.forEach(q => parts.push(`Q: ${q.label}\nA: ${state.answers[q.id]}`));
  }
  if(state.s6_status === "No" || state.s6_status === "It's complicated"){
    parts.push(`Open to calling in a partner: ${state.s6_calling_in_choice}`);
    if(state.s6_calling_in_choice === "Yes"){
      parts.push(`Q: ${REL_CALLING_IN_DETAIL.label}\nA: ${state.answers[REL_CALLING_IN_DETAIL.id]}`);
    }
    parts.push(`Q: ${REL_DESERVE_LOVE.label}\nA: ${state.answers[REL_DESERVE_LOVE.id]}`);
    parts.push(`Q: ${REL_STOP_TOLERATING.label}\nA: ${state.answers[REL_STOP_TOLERATING.id]}`);
  }
  REL_COMMON.forEach(q => parts.push(`Q: ${q.label}\nA: ${state.answers[q.id]}`));

  parts.push("\nSECTION 7: HER FUTURE");
  SECTION7.questions.forEach(q => parts.push(`Q: ${q.label}\nA: ${state.answers[q.id]}`));
  parts.push(`\nHer three completed closing sentences (use verbatim as the closing lines):`);
  parts.push(`I am a woman who ${state.answers["s7_sentence1"]}`);
  parts.push(`I trust myself to ${state.answers["s7_sentence2"]}`);
  parts.push(`I no longer need ${state.answers["s7_sentence3"]}`);

  parts.push(`\nWrite her sovereign self script now, following the system instructions exactly.`);

  return parts.join("\n\n");
}

async function generateScript(){
  try{
    const response = await fetch("https://api.anthropic.com/v1/messages", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        model: "claude-sonnet-4-6",
        max_tokens: 1000,
        system: SYSTEM_PROMPT,
        messages: [
          { role: "user", content: compileUserMessage() }
        ]
      })
    });

    if(!response.ok){
      throw new Error("The connection to generate your script didn't go through.");
    }

    const data = await response.json();
    const textBlock = (data.content || []).find(b => b.type === "text");
    if(!textBlock || !textBlock.text){
      throw new Error("Your script came back empty.");
    }
    state.generatedScript = textBlock.text.trim();
    goTo("result");
  } catch(err){
    state.step = "error";
    renderErrorScreen("Take a breath and try again. Nothing you entered was lost. If this keeps happening, your answers are still safe on this page; you can copy them elsewhere before retrying.");
  }
}

// ---------- Master render ----------
function render(){
  switch(state.step){
    case "privacy": renderPrivacy(); break;
    case "s1": renderStaticSection(SECTION1, "s1", null, "s2"); break;
    case "s2": renderStaticSection(SECTION2, "s2", "s1", "s3"); break;
    case "s3": renderStaticSection(SECTION3, "s3", "s2", "s4"); break;
    case "s4": renderStaticSection(SECTION4, "s4", "s3", "s5"); break;
    case "s5": renderSection5(); break;
    case "s6": renderSection6(); break;
    case "s7": renderSection7(); break;
    case "commitment": renderCommitment(); break;
    case "generating": renderGenerating(); break;
    case "result": renderResult(); break;
    case "error": renderErrorScreen("Take a breath and try again. Nothing you entered was lost."); break;
    default: renderPrivacy();
  }
}

render();
